# Tests every pull request and every push to main. Staging publishes
# immediately without running tests (owner decision, 2026-10-25).
#
#   main     →  the live game      https://shibl.github.io/sindibad/
#   staging  →  the staging copy   https://shibl.github.io/sindibad/staging/
#
# Main is never published when tests fail. A publish turns green once the
# website is rebuilt, and shows under Deployments on GitHub (github-pages
# for the live game, staging for the staging copy). Players' devices pick
# up a new version the next time they open the game online (service
# worker). The staging copy keeps its own saves and offline copy
# (Studio/Games/Sindibad-Yasmina/Classes/Grade6/Web/core/env.js).
#
# GitHub Pages builds the website from one branch, SITE_BRANCH. This
# workflow writes that branch; nobody pushes to it by hand. Each publish
# replaces only its own part (the live game at the top, or staging/) and
# keeps the other as it was, so a branch whose tests fail never reaches
# the site. If the repository owner changes Settings → Pages (another
# branch, or "GitHub Actions"), publishing stops with an error until this
# file is updated to match (BACKLOG item 23).

name: Test and publish

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_BRANCH: claude/sharp-hawking-0380ax

jobs:
  test:
    if: github.ref_name != 'staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Studio/Games/Sindibad-Yasmina/Classes/Grade6/Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check publication layout
        run: python3 "$GITHUB_WORKSPACE/.github/tests/test_pages_layout.py"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  publish:
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && ((github.ref_name == 'main' && needs.test.result == 'success') || (github.ref_name == 'staging' && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to SITE_BRANCH
      pages: read       # check the Pages settings and builds
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'github-pages' }}
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.ref_name == 'staging' && 'staging/' || '' }}
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash   # stop on any error, also inside a pipe
    steps:
      - name: Check that Pages still builds from SITE_BRANCH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '"\(.build_type) \(.source.branch)"')
          if [ "$source" != "legacy $SITE_BRANCH" ]; then
            echo "::error::Pages builds from \"$source\", not from the branch $SITE_BRANCH. Update .github/workflows/site.yml."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SITE_BRANCH }}

      - name: Put the tested version in its place
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          source_dir=$(mktemp -d)
          public_dir=$(mktemp -d)
          trap 'rm -rf "$source_dir" "$public_dir"' EXIT
          git archive FETCH_HEAD | tar -x -C "$source_dir"
          python3 "$source_dir/.github/scripts/prepare-pages.py" "$source_dir" "$public_dir"
          if [ "$GITHUB_REF_NAME" = staging ]; then
            dest=staging
            rm -rf staging
          else
            dest=.
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name staging -exec rm -rf {} +
          fi
          mkdir -p "$dest"
          cp -a "$public_dir/." "$dest/"
          touch .nojekyll   # serve the files as they are
          test -f Web/index.html && test -f "$dest/Web/index.html"   # never publish an empty site

      - name: Publish
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Nothing changed.'; exit 0; fi
          git commit -q -m "Publish $GITHUB_REF_NAME ${GITHUB_SHA::7}"
          # main and staging may publish at the same moment; their parts
          # don't overlap, so catch up and try again.
          for try in 1 2 3; do
            git push origin "HEAD:$SITE_BRANCH" && { echo pushed=true >> "$GITHUB_OUTPUT"; exit 0; }
            git fetch origin "$SITE_BRANCH" && git rebase FETCH_HEAD
          done
          exit 1

      - name: Wait until the website is rebuilt
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for i in $(seq 60); do   # up to 10 minutes
            build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '"\(.status) \(.commit)"')
            case "$build" in
              "built $sha") echo 'The website is rebuilt.'; exit 0 ;;
              "errored $sha") echo '::error::GitHub Pages could not build the website.'; exit 1 ;;
            esac
            # A newer publish came after this one; its own run waits for it.
            if [ "$(git ls-remote origin "refs/heads/$SITE_BRANCH" | cut -f1)" != "$sha" ]; then
              echo 'A newer publish took over.'; exit 0
            fi
            sleep 10
          done
          echo '::error::GitHub Pages took more than 10 minutes to rebuild the website.'
          exit 1
