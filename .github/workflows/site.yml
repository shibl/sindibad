# Tests every pull request. When main changes, tests again and publishes
# the game to GitHub Pages — so merging a pull request is what makes it go
# live, and nothing goes live with failing tests. Players' devices pick up
# the new version the next time they open the game online (service worker).
#
# The game lives in Web/. The whole repository is published; the top-level
# index.html forwards to Web/. Publishing starts once the repository owner
# sets Settings → Pages → Source to "GitHub Actions" (BACKLOG item 23).
# Until then Pages builds from a branch, and the publish job is skipped.

name: Test and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Is Pages set to publish from this workflow yet?
  pages-mode:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      type: ${{ steps.mode.outputs.type }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api repos/${{ github.repository }}/pages --jq .build_type || echo none)" >> "$GITHUB_OUTPUT"

  publish:
    needs: pages-mode
    if: needs.pages-mode.outputs.type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
