name: Grade 6 Android
on:
  pull_request:
    paths:
      - '.github/workflows/grade6-android.yml'
      - 'Studio/Games/Sindibad-Yasmina/Classes/Grade6/Android/**'
      - 'Studio/Games/Sindibad-Yasmina/Classes/Grade6/Shared/Art/**'
      - 'Studio/Games/Sindibad-Yasmina/Classes/Grade6/Web/worlds/grade6.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Studio/Games/Sindibad-Yasmina/Classes/Grade6/Android
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Studio/Games/Sindibad-Yasmina/Classes/Grade6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Test, lint and build native packages
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: sindibad-grade6-debug
          path: Studio/Games/Sindibad-Yasmina/Classes/Grade6/Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
