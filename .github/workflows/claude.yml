# The improvement agent. A maintainer adds the `agent-ready` label to an
# issue (or mentions @claude in a comment) → Claude works on it in a new
# branch, runs the tests, and replies with a link to open a pull request.
# A person reviews and merges; merging publishes (site.yml).
#
# - The agent's rules are in CLAUDE.md.
# - Only people with write access can trigger it (the action checks).
# - Comments are read only from the maintainers listed in
#   include_comments_by_actor, so strangers can't steer the agent through
#   comments. Add new maintainers there.

name: Claude agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent-ready') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: Web
      - run: npx playwright install --with-deps chromium
        working-directory: Web
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: agent-ready
          include_comments_by_actor: shibl,sam-a1a
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm --prefix Web test),Bash(node Web/tools/update-shell.mjs),Bash(node Web/tests/check-shell.mjs),Bash(node Web/tests/e2e.mjs)"
