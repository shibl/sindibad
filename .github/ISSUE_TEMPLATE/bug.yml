name: "🐞 مشكلة في اللعبة · Bug"
description: "شيء لا يعمل كما يجب · Something doesn't work"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        شكراً لمساعدتك! هذه الصفحة **عامة** يراها الجميع: لا تكتب اسم أي طفل أو مدرسة أو مدينة.
        Thank you! This page is **public**: please don't include any child's name, school or town.
  - type: textarea
    id: what
    attributes:
      label: "ماذا حدث؟ · What happened?"
      description: "صِف المشكلة، وما الذي توقّعتَ أن يحدث. · Describe the problem and what you expected."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "كيف نرى المشكلة؟ · How can we see it?"
      description: "اكتب الخطوات بالترتيب، مثلاً: جزيرة الرياضيات ← درس الكسور ← السؤال الثالث. · The steps, in order."
  - type: input
    id: device
    attributes:
      label: "الجهاز والمتصفح · Device and browser"
      placeholder: "مثلاً: Samsung A10، Chrome"
  - type: textarea
    id: screenshot
    attributes:
      label: "صورة للشاشة (اختياري) · Screenshot (optional)"
      description: "اسحب الصورة إلى هنا. · Drag the image here."
