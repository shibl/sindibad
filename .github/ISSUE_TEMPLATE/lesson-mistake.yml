name: "📚 خطأ في درس · Lesson mistake"
description: "سؤال أو جواب أو شرح أو معلومة غير صحيحة · A wrong question, answer, explanation or fact"
labels: [lesson]
body:
  - type: markdown
    attributes:
      value: |
        شكراً لمساعدتك! سيراجع معلّمٌ كلَّ تصحيح قبل نشره.
        هذه الصفحة **عامة** يراها الجميع: لا تكتب اسم أي طفل أو مدرسة أو مدينة.

        Thank you! A teacher checks every correction before it goes live.
        This page is **public**: please don't include any child's name, school or town.
  - type: input
    id: where
    attributes:
      label: "أين الخطأ؟ · Where is it?"
      placeholder: "مثلاً: جزيرة العلوم ← درس الضوء ← السؤال الثاني"
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: "ما الخطأ؟ · What is wrong?"
      description: "انسخ النص كما يظهر في اللعبة إن أمكن. · Copy the text as it appears in the game, if you can."
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: "ما الصحيح؟ · What is correct?"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "المصدر (اختياري) · Source (optional)"
      placeholder: "مثلاً: كتاب الصف السادس، الجزء الأول، الصفحة ٤٢"
  - type: dropdown
    id: role
    attributes:
      label: "أنت · You are"
      options:
        - "معلّم أو معلّمة · Teacher"
        - "أحد الأهل · Parent"
        - "طالب أو طالبة · Student"
        - "غير ذلك · Other"
