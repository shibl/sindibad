# The game server on a VPS: the API behind Caddy, which gets and renews the
# HTTPS certificate by itself. Set up with ./setup.sh (README.md here).
#   docker compose up -d --build     start or update
#   docker compose logs -f api       the server's log, live
name: sindibad

# Every service's log, kept on disk: up to 20 files of 50 MB each.
x-logging: &logging
  driver: json-file
  options: { max-size: 50m, max-file: "20" }

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sindibad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sindibad
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindibad -d sindibad"]
      interval: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging

  valkey:
    image: valkey/valkey:9.1.3-alpine
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging

  api:
    build: ..
    environment:
      DATABASE_URL: postgres://sindibad:${POSTGRES_PASSWORD}@postgres:5432/sindibad
      VALKEY_URL: redis://valkey:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  valkeydata:
  caddydata:
  caddyconfig:
