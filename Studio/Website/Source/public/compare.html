<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero concepts</title>
<style>
  :root { --ink: #004646; --pink: #fa2a6f; --paper: #f0efec; --line: #c9dde0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { padding: 28px 24px 8px; max-width: 1600px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.01em; }
  header p { margin: 0; opacity: .75; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 620px), 1fr)); gap: 22px; padding: 18px 24px 48px; max-width: 1600px; margin: 0 auto; }
  figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .frame { position: relative; aspect-ratio: 1440 / 900; overflow: hidden; background: #d6ecf0; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; }
  figcaption { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px 14px; }
  figcaption b { font-size: 16px; white-space: nowrap; }
  figcaption span { flex: 1; opacity: .75; }
  figcaption a { color: var(--pink); font-weight: 600; text-decoration: none; white-space: nowrap; }
  figcaption a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>Hero concepts for design A</h1>
  <p>Each frame is the real page at 1440×900. Use “Open” to try it full size.</p>
</header>
<main id="grid"></main>
<script>
  const concepts = [
    ['claw', 'Claw machine', 'A glass claw machine on the hero.'],
    ['press', "Don’t press", 'A big pink button under a clear cover. The sign text gets translated per language.'],
    ['pet', 'A pet that lives here', 'A furry studio mascot on a velvet cushion.'],
    ['window', 'A window to other worlds', 'An arch that opens onto a dusk world of pink dunes, a ringed planet and glowing jellyfish. One got out. The world inside shifts with the mouse like a real opening.'],
    ['forty', 'Forty years in one scroll', 'One treasure chest in five eras of games, 1986 to today. The eras arrive one by one, the slice under the mouse widens, and scrolling sweeps the chest to today.'],
    ['level', 'The headline is a level', 'A little runner plays the real headline: it reads the letter shapes in any language, hops over the tall letters, grabs coins, zig-zags down the lines and leaps onto the goal island. Click to make it jump.'],
  ]
  const grid = document.getElementById('grid')
  for (const [id, name, note] of concepts) {
    const url = id ? `/?concept=${id}` : '/'
    const fig = document.createElement('figure')
    fig.innerHTML = `<div class="frame"><iframe loading="lazy" src="${url}" title="${name}"></iframe></div>
      <figcaption><b>${name}</b><span>${note}</span><a href="${url}" target="_blank">Open ↗</a></figcaption>`
    grid.append(fig)
  }
  const fit = () => document.querySelectorAll('.frame').forEach(f => {
    f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1440})`
  })
  new ResizeObserver(fit).observe(grid)
  fit()
</script>
</body>
</html>
