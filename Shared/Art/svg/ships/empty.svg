<svg xmlns="http://www.w3.org/2000/svg" class="ship-art" viewBox="-4 -6 378 270" aria-hidden="true"><defs>
    <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b06a36"/><stop offset=".55" stop-color="#8a4c24"/><stop offset="1" stop-color="#5e3214"/>
    </linearGradient>
    <linearGradient id="g-sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f6e7c8"/><stop offset="1" stop-color="#e2c99a"/>
    </linearGradient>
    <linearGradient id="g-skin-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#7a3b1c" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="g-frond" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7d3c"/><stop offset="1" stop-color="#58b04f"/>
    </linearGradient>
    <linearGradient id="g-trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a26"/><stop offset=".5" stop-color="#a86e3c"/><stop offset="1" stop-color="#6b3f1f"/>
    </linearGradient>
    <linearGradient id="g-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e0a93a"/><stop offset="1" stop-color="#a8741e"/>
    </linearGradient>
    <radialGradient id="g-glow">
      <stop offset="0" stop-color="#fff2b0" stop-opacity="1"/><stop offset=".4" stop-color="#ffc94a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-cheek">
      <stop offset="0" stop-color="#ff7f7f" stop-opacity=".55"/><stop offset="1" stop-color="#ff7f7f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-hudhud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ac6c"/><stop offset="1" stop-color="#d9824a"/>
    </linearGradient>
  </defs>
  <!-- rigging -->
  <path d="M202 36 L24 172 M202 36 L336 160" stroke="#3b2414" stroke-width="1.5" opacity=".6"/>
  <!-- mast -->
  <path d="M214 196 L199 8" stroke="#3b2414" stroke-width="11" stroke-linecap="round"/>
  <path d="M214 196 L199 8" stroke="#7a4520" stroke-width="6" stroke-linecap="round"/>
  <!-- lateen sail -->
  <g class="sail">
    <path d="M62 92 Q176 34 300 22 Q262 110 222 178 Q148 128 62 92Z" fill="url(#g-sail)" stroke="#3b2414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <path d="M110 70 Q156 110 178 150 M160 50 Q186 100 200 164 M214 36 Q222 90 222 172 M258 28 Q248 90 232 160" fill="none" stroke="#d8bf8e" stroke-width="2"/>
    <path d="M150 96 l18 -6 l6 16 l-18 6Z" fill="#e8d3a6" stroke="#3b2414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M62 92 Q176 34 300 22" fill="none" stroke="#3b2414" stroke-width="9" stroke-linecap="round"/>
    <path d="M62 92 Q176 34 300 22" fill="none" stroke="#8a4c24" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="flag"><path d="M199 4 Q224 0 250 10 Q226 12 200 20Z" fill="#d0507e" stroke="#3b2414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g>
  <circle cx="199" cy="6" r="4" fill="url(#g-brass)" stroke="#3b2414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- crew -->


  <!-- hull -->
  <path d="M18 176 Q60 190 110 192 L290 192 Q320 188 344 160 L338 206 Q318 238 264 244 L110 244 Q60 238 18 176Z" fill="url(#g-wood)" stroke="#3b2414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M24 180 Q62 196 110 198 L290 198 Q322 194 342 170 L341 184 Q320 206 290 208 L110 208 Q64 206 30 188Z" fill="#23a39a" stroke="#3b2414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M36 196 l6 -6 l6 6 M52 196 l6 -6 l6 6 M68 196 l6 -6 l6 6 M84 196 l6 -6 l6 6 M100 196 l6 -6 l6 6 M116 196 l6 -6 l6 6 M132 196 l6 -6 l6 6 M148 196 l6 -6 l6 6 M164 196 l6 -6 l6 6 M180 196 l6 -6 l6 6 M196 196 l6 -6 l6 6 M212 196 l6 -6 l6 6 M228 196 l6 -6 l6 6 M244 196 l6 -6 l6 6 M260 196 l6 -6 l6 6 M276 196 l6 -6 l6 6 M292 196 l6 -6 l6 6 M308 196 l6 -6 l6 6 M324 196 l6 -6 l6 6" fill="none" stroke="#fbf1dc" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M58 214 Q100 224 150 224 L300 222 M84 230 Q120 236 170 236 L290 234" fill="none" stroke="#4a2610" stroke-width="2" opacity=".55"/>
  <path d="M300 214 h18 v12 h-18Z M270 216 h16 v10 h-16Z" fill="#f2c14e" stroke="#3b2414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M18 176 Q6 164 12 152 Q20 150 20 160" fill="none" stroke="#3b2414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- stern lantern (glows at night) -->
  <circle class="lantern-glow" cx="330" cy="150" r="40" fill="url(#g-glow)"/>
  <path d="M330 162 V176" stroke="#3b2414" stroke-width="3"/>
  <rect x="322" y="140" width="16" height="22" rx="4" fill="#ffe08a" stroke="#3b2414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M320 140 h20 l-4 -6 h-12Z" fill="#7a4520" stroke="#3b2414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- foam at the waterline -->
  <path d="M40 232 Q190 250 336 228 L340 252 Q190 262 36 250Z" fill="#2c9fc6" opacity=".55"/>
  <g class="foam" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M30 236 q10 -8 20 0 t20 0 M110 246 q10 -7 20 0 t20 0 t20 0 M230 244 q10 -7 20 0 t20 0 M300 236 q10 -8 20 0 t20 0"/>
  </g>
</svg>
