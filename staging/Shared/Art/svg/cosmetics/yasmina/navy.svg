<svg xmlns="http://www.w3.org/2000/svg" class="hero-art " viewBox="0 0 200 300" aria-hidden="true"><defs>
    <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b06a36"/><stop offset=".55" stop-color="#8a4c24"/><stop offset="1" stop-color="#5e3214"/>
    </linearGradient>
    <linearGradient id="g-sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f6e7c8"/><stop offset="1" stop-color="#e2c99a"/>
    </linearGradient>
    <linearGradient id="g-skin-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#7a3b1c" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="g-frond" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7d3c"/><stop offset="1" stop-color="#58b04f"/>
    </linearGradient>
    <linearGradient id="g-trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a26"/><stop offset=".5" stop-color="#a86e3c"/><stop offset="1" stop-color="#6b3f1f"/>
    </linearGradient>
    <linearGradient id="g-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e0a93a"/><stop offset="1" stop-color="#a8741e"/>
    </linearGradient>
    <radialGradient id="g-glow">
      <stop offset="0" stop-color="#fff2b0" stop-opacity="1"/><stop offset=".4" stop-color="#ffc94a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-cheek">
      <stop offset="0" stop-color="#ff7f7f" stop-opacity=".55"/><stop offset="1" stop-color="#ff7f7f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-hudhud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ac6c"/><stop offset="1" stop-color="#d9824a"/>
    </linearGradient>
  </defs><style>
.nl__svg { width: 100%; height: auto; overflow: visible; }

.nl__water { fill: #bfe9f5; stroke: #3b2414; stroke-width: 3; }

.nl__ripple { fill: none; stroke: #fff; stroke-width: 3; opacity: .7; }

.nl__axis { stroke: #3b2414; stroke-width: 6; stroke-linecap: round; }

.nl__tick { stroke: #3b2414; stroke-width: 4; stroke-linecap: round; }

.nl__badge { fill: #fff; stroke: #3b2414; stroke-width: 4; }

.nl__label { font: 800 44px "Baloo Bhaijaan 2", sans-serif; fill: #3b2414; text-anchor: middle; }

.nl__mast { stroke: #3b2414; stroke-width: 3; }

.nl__boat { transition: transform .7s cubic-bezier(.3, .8, .3, 1.2); }

.nl__hull { fill: #a0602e; stroke: #3b2414; stroke-width: 3; }

.nl__sail { fill: #fff7e6; stroke: #3b2414; stroke-width: 3; stroke-linejoin: round; }

.nl__pole { stroke: #3b2414; stroke-width: 4; }

.nl__pennant { fill: #2f8a5f; stroke: #3b2414; stroke-width: 3; }

.nl.is-right .nl__water { fill: #b9f0b4; }

.nl__help { margin: 0; color: #6b4a32; font-size: 15px; }

.helm__svg { display: block; width: 100%; height: auto; overflow: visible; }

.helm__sea { fill: #bfe9f5; stroke: #3b2414; stroke-width: 4; stroke-linejoin: round; transition: fill .3s; }

.helm.is-right .helm__sea { fill: #b9f0b4; }

.helm__ripple { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: .7; }

.helm__tick { stroke: #3b2414; stroke-width: 3; stroke-linecap: round; }

.helm__num { font: 800 21px "Baloo Bhaijaan 2", sans-serif; fill: #6b4a32; text-anchor: middle; }

.helm__wedge { fill: #d0507e; fill-opacity: .25; stroke: #d0507e; stroke-width: 3; }

.helm__base { stroke: #3b2414; stroke-width: 6; stroke-linecap: round; }

.helm__course { stroke: #d0507e; stroke-width: 6; stroke-linecap: round; }

.helm__deg { font: 800 26px "Baloo Bhaijaan 2", sans-serif; fill: #3b2414; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }

.helm__hull { fill: #a0602e; stroke: #3b2414; stroke-width: 3; stroke-linejoin: round; }

.helm__sail { fill: none; stroke: #fff7e6; stroke-width: 5; stroke-linecap: round; }

.helm__mast { fill: #fff7e6; stroke: #3b2414; stroke-width: 2; }

.helm__pin { fill: #f2c14e; stroke: #3b2414; stroke-width: 3; }

.helm__buoy-body { fill: #fff; stroke: #3b2414; stroke-width: 3; }

.helm__flag { fill: #2f8a5f; stroke: #3b2414; stroke-width: 3; stroke-linejoin: round; }

.helm.is-sailing .helm__ship { transition: transform 1s cubic-bezier(.4, 0, .3, 1); }

.helm__controls, .fill__controls { display: flex; align-items: center; justify-content: center; gap: 12px; }

.helm__turn { font-size: 30px; line-height: 1; }

.fill__read {
  min-width: 60px; padding: 0 10px 2px; text-align: center; font-size: 24px; font-weight: 800;
  background: #fff; border: 3px solid #3b2414; border-radius: 16px; box-shadow: 0 4px 0 #d0507e;
}

.market__go, .fill__go { min-height: 48px; padding: 4px 16px 8px; font-size: 19px; white-space: nowrap; }

.fill__scene { width: 100%; max-width: 250px; }
 .fill__scene { max-width: 330px; }
 .fill__scene { max-width: 215px; }
 .fill__scene { max-width: 180px; }

.fill__svg { display: block; width: 100%; height: auto; overflow: visible; }

.fill__glass { fill: rgba(255, 255, 255, .8); }

.fill__frame { fill: none; stroke: #3b2414; stroke-width: 4; transition: stroke .2s; }

.fill.is-wrong .fill__frame { stroke: #d9434f; }

.fill.is-wrong .fill__scene { animation: shake .45s; }

.fill__wave { fill: #4fb3e8; }

.fill__water { transition: transform .4s cubic-bezier(.3, .8, .3, 1.1); }

.fill.is-pouring .fill__water { transition-duration: .9s; }

.fill__line { stroke: #3b2414; stroke-width: 2; stroke-dasharray: 6 6; opacity: .5; }

.fill__mark { stroke: #3b2414; stroke-width: 3; stroke-linecap: round; }

.fill__hit { fill: transparent; cursor: pointer; }

.fill__stand { fill: none; stroke: #8a5a30; stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; }

.fill__river { fill: none; stroke: #4fb3e8; stroke-width: 8; stroke-linecap: round; }

.fill__wheel { transform-box: view-box; transform-origin: 262px 128px; transition: transform 1.4s cubic-bezier(.3, .7, .3, 1); }

.fill__rim { fill: none; stroke: #8a5a30; stroke-width: 8; }

.fill__rim--in { stroke-width: 4; }

.fill__spoke { stroke: #6b3f1f; stroke-width: 5; }

.fill__cup { fill: #b98a5a; stroke: #3b2414; stroke-width: 2; }

.fill__hub { fill: #f2c14e; stroke: #3b2414; stroke-width: 3; }

.fill__stream { fill: none; stroke: #4fb3e8; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 300; stroke-dashoffset: 300; opacity: 0; }

.fill.is-pouring .fill__stream { animation: pour 1.1s ease-out forwards; }

.viz .viz__cap--small { font-size: 15px; line-height: 1.3; text-align: center; color: #3b2414; }

.viz__cap { font-size: 26px; font-weight: 800; color: #d0507e; }

.viz__num { font: 800 22px "Baloo Bhaijaan 2", sans-serif; fill: #3b2414; }

.viz__name { font: 800 13px "Baloo Bhaijaan 2", sans-serif; fill: #3b2414; }

.fig-t { font: 800 16px "Baloo Bhaijaan 2", sans-serif; fill: #3b2414; text-anchor: middle; }</style><g class="hero hero--yasmina">
